<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <script>
        function counter(value) {
            console.log(value);
        }
        const promise = new Promise((resolve, reject) => {
            resolve("Start Counting.");
            
            
        }).then(value => {
            counter(value);
            return "one"
        }).then(value => {
            counter(value);
            return "two"
        }).then(value => {
            counter(value);
            return "three"
        }).then(value => {
            counter(value);
        })
        
    </script>
</body>
</html>
