<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <script>
        function* infiniteNumbers() {
  let n = 1;
  while (true) {
    yield n++;
  }
}

const numbers = infiniteNumbers();

numbers.next(); // 1
numbers.next(); // 2
console.log(numbers.next().value); // 3

    </script>
</body>
</html>
