<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree</title>
</head>
<body>
    <script>
        const breadthFirstValues = (root) => {
            if (root === null) return [];

            const values = [];
            const queue = [ root ];

            while (queue.length > 0) {
                const current = queue.shift();
                values.push(current.val);
                console.log(values)
                if (current.left) queue.push(current.left);
                if (current.right) queue.push(current.right);
            }

            return values;
        };


        class Node {
            constructor(val) {
                this.val = val;
                this.left = null;
                this.right = null;
            }
        }
        const a = new Node('a');
        const b = new Node('b');
        const c = new Node('c');
        const d = new Node('d');
        const e = new Node('e');
        const f = new Node('f');
        a.left = b;
        a.right = c;
        b.left = d;
        b.right = e;
        c.right = f;
        breadthFirstValues(a);
    </script>
</body>
</html>
